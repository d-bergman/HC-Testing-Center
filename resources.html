<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Testing Center Resources</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
</head>

<body>
  <div class="app-shell container-fluid py-3">

    <header class="app-header d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-3 mb-3">
      <div class="d-flex align-items-center gap-3">
        <div class="clock-icon">🔗</div>
        <div>
          <h1 class="mb-0">Testing Center Resources</h1>
          <p class="mb-0 text-secondary-custom">Useful links and staff resources</p>
        </div>
      </div>

            <div class="d-flex gap-2">
        <a href="guides.html" class="btn btn-sound">
            📚 Guides
        </a>

        <a href="index.html" class="btn btn-sound">
            ← Back to Dashboard
        </a>
        </div>
    </header>

    <main class="row g-3">
      <section class="col-12 col-xl-4">
        <div class="panel h-100">
          <section class="app-card">
            <h2>Add Resource</h2>

            <label for="resourceTitleInput" class="form-label mt-2">Title</label>
            <input id="resourceTitleInput" class="form-control" type="text" placeholder="CLEP Portal" />

            <label for="resourceUrlInput" class="form-label mt-3">URL</label>
            <input id="resourceUrlInput" class="form-control" type="url" placeholder="https://..." />

            <label for="resourceCategoryInput" class="form-label mt-3">Category</label>
            <input id="resourceCategoryInput" class="form-control" type="text" placeholder="Testing Vendors" />

            <label for="resourceDescriptionInput" class="form-label mt-3">Description Optional</label>
            <textarea id="resourceDescriptionInput" class="form-control" rows="3" placeholder="Short note for staff..."></textarea>

            <button id="addResourceBtn" class="btn btn-primary-custom w-100 mt-3">
              + Add Resource
            </button>

            <p id="resourceError" class="password-error"></p>
          </section>
        </div>
      </section>

      <section class="col-12 col-xl-8">
        <div class="panel h-100">
          <section class="app-card">
            <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
              <h2 class="mb-0">Resources</h2>
              <span id="resourceCount" class="small text-secondary-custom">0 resources</span>
            </div>

            <div class="row g-2 mb-3">
  <div class="col-12 col-md-8">
    <input
      id="resourceSearchInput"
      class="form-control"
      type="text"
      placeholder="Search resources..."
    />
  </div>

  <div class="col-12 col-md-4">
    <select id="resourceCategoryFilter" class="form-select">
      <option value="">All Categories</option>
    </select>
  </div>
</div>

            <div id="resourceList" class="timer-list">
              <div class="empty-state">No resources added yet.</div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="footer d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-3 mt-3">
      <p class="mb-0 text-center">Harper Testing Center – Resources</p>
      <p class="mb-0 text-center">Version <span class="app-version">Loading...</span></p>
    </footer>

  </div>

  <!-- Modal for Editing Resources -->
<div class="modal fade" id="editResourceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content alarm-modal">
      <div class="modal-header">
        <h2 class="modal-title">Edit Resource</h2>
      </div>

      <div class="modal-body">
        <label for="editResourceTitleInput" class="form-label">Title</label>
        <input id="editResourceTitleInput" class="form-control" type="text" />

        <label for="editResourceUrlInput" class="form-label mt-3">URL</label>
        <input id="editResourceUrlInput" class="form-control" type="url" />

        <label for="editResourceCategoryInput" class="form-label mt-3">Category</label>
        <input id="editResourceCategoryInput" class="form-control" type="text" />

        <label for="editResourceDescriptionInput" class="form-label mt-3">Description Optional</label>
        <textarea id="editResourceDescriptionInput" class="form-control" rows="3"></textarea>

        <p id="editResourceError" class="password-error"></p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>

        <button id="saveEditResourceBtn" type="button" class="btn btn-primary-custom">
          Save Resource
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Deleting Resources -->
<div class="modal fade" id="deleteResourceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content alarm-modal">
      <div class="modal-header">
        <h2 class="modal-title">Delete Resource</h2>
      </div>

      <div class="modal-body">
        <p id="deleteResourceMessage" class="mb-0"></p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>

        <button id="confirmDeleteResourceBtn" type="button" class="resource-delete-btn">
          Delete
        </button>
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="./assets/js/resources.js"></script>
</body>
</html>
